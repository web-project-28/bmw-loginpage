<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>BMW Astra Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02050a;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    perspective:1200px;
    color:white;
}

/* ================= BACKGROUND ================= */

.scene{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%,#102238 0%,#050b14 38%,#010204 75%);
}

/* blue atmosphere */

.scene::before{
    content:"";
    position:absolute;
    inset:-30%;
    background:
        radial-gradient(circle at 50% 60%,
        rgba(0,110,255,.25),
        transparent 35%);
    animation:atmosphere 5s ease-in-out infinite alternate;
}

@keyframes atmosphere{
    from{transform:scale(.9);opacity:.5}
    to{transform:scale(1.2);opacity:1}
}

/* ================= STARS / PARTICLES ================= */

.particles{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    background:#8fcaff;
    border-radius:50%;
    box-shadow:0 0 8px #168cff;
    animation:particleMove linear infinite;
}

.p1{left:8%;top:20%;animation-duration:4s}
.p2{left:18%;top:70%;animation-duration:6s}
.p3{left:31%;top:12%;animation-duration:5s}
.p4{left:48%;top:30%;animation-duration:7s}
.p5{left:65%;top:16%;animation-duration:4s}
.p6{left:78%;top:63%;animation-duration:5s}
.p7{left:91%;top:28%;animation-duration:6s}
.p8{left:55%;top:82%;animation-duration:4s}
.p9{left:26%;top:88%;animation-duration:7s}
.p10{left:73%;top:90%;animation-duration:5s}

@keyframes particleMove{
    0%{
        transform:translateY(30px) scale(.5);
        opacity:0;
    }
    20%{opacity:1}
    80%{opacity:1}
    100%{
        transform:translateY(-180px) scale(1.5);
        opacity:0;
    }
}

/* ================= ROAD ================= */

.road{
    position:absolute;
    left:50%;
    bottom:-18%;
    width:160%;
    height:65%;
    transform:translateX(-50%) perspective(500px) rotateX(68deg);
    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(0,105,255,.08) 30%,
            rgba(0,120,255,.18)
        );
    border-top:1px solid rgba(70,160,255,.2);
}

.road::before,
.road::after{
    content:"";
    position:absolute;
    width:4px;
    height:100%;
    background:linear-gradient(
        to bottom,
        transparent,
        #168cff,
        transparent
    );
    filter:blur(3px);
}

.road::before{
    left:25%;
}

.road::after{
    right:25%;
}

/* ================= SPEED LINES ================= */

.speed-lines{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.speed{
    position:absolute;
    height:2px;
    background:linear-gradient(
        90deg,
        transparent,
        #48aaff,
        white,
        transparent
    );
    filter:blur(1px);
    opacity:0;
}

.s1{top:25%;left:5%;width:32%}
.s2{top:38%;right:4%;width:30%}
.s3{top:52%;left:2%;width:25%}
.s4{top:66%;right:8%;width:35%}
.s5{top:76%;left:10%;width:30%}
.s6{top:18%;right:12%;width:22%}

.car-speed .speed{
    animation:speedRush .75s linear infinite;
}

@keyframes speedRush{
    0%{
        transform:translateX(0) scaleX(.2);
        opacity:0;
    }
    20%{opacity:1}
    100%{
        transform:translateX(-350px) scaleX(2.5);
        opacity:0;
    }
}

/* ================= BMW ================= */

.car-wrap{
    position:absolute;
    left:50%;
    top:50%;
    width:min(900px,90vw);
    transform-style:preserve-3d;
    transform:
        translate(-50%,-50%)
        translateZ(-1800px)
        scale(.08);
    opacity:0;
    z-index:5;
}

.car-wrap img{
    display:block;
    width:100%;
    height:auto;
    object-fit:contain;

    /* removes a little visual harshness around image */
    filter:
        drop-shadow(0 20px 40px rgba(0,0,0,.9))
        drop-shadow(0 0 30px rgba(0,115,255,.45));
}

/* acceleration */

.car-driving{
    animation:bmwDrive 5.2s cubic-bezier(.16,.72,.18,1) infinite;
}

@keyframes bmwDrive{

    0%{
        transform:
            translate(-50%,-50%)
            translateZ(-1800px)
            scale(.07);
        opacity:0;
        filter:blur(5px);
    }

    8%{
        opacity:.3;
    }

    20%{
        transform:
            translate(-50%,-50%)
            translateZ(-1000px)
            scale(.25);
        opacity:.65;
        filter:blur(2px);
    }

    42%{
        transform:
            translate(-50%,-50%)
            translateZ(-250px)
            scale(.7);
        opacity:1;
        filter:blur(0);
    }

    55%{
        transform:
            translate(-50%,-50%)
            translateZ(150px)
            scale(1.15);
        opacity:1;
    }

    70%{
        transform:
            translate(-50%,-50%)
            translateZ(450px)
            scale(1.7);
        opacity:1;
        filter:blur(1px);
    }

    100%{
        transform:
            translate(-50%,-50%)
            translateZ(1200px)
            scale(4);
        opacity:0;
        filter:blur(8px);
    }
}

/* ================= HEADLIGHT GLOW ================= */

.headlight{
    position:absolute;
    left:50%;
    top:58%;
    width:70%;
    height:100px;
    transform:translate(-50%,-50%);
    background:radial-gradient(
        ellipse,
        rgba(120,210,255,.45),
        transparent 65%
    );
    filter:blur(20px);
    opacity:0;
    pointer-events:none;
    z-index:4;
}

.car-driving ~ .headlight{
    animation:headlightFlash 5.2s infinite;
}

@keyframes headlightFlash{
    0%,20%{opacity:0}
    35%{opacity:.15}
    50%{opacity:.65}
    65%{opacity:1}
    100%{opacity:0}
}

/* ================= LOGIN CARD ================= */

.login-card{
    position:absolute;
    z-index:20;
    top:50%;
    left:50%;

    width:min(390px,88vw);
    padding:38px 30px;

    transform:
        translate(-50%,-50%)
        translateZ(80px);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.16);
    border-radius:24px;

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        inset 0 1px rgba(255,255,255,.15),
        0 0 50px rgba(0,100,255,.12);

    transition:
        transform .3s ease,
        opacity .5s ease;
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:900;
    letter-spacing:5px;
    margin-bottom:5px;

    background:linear-gradient(
        90deg,
        #fff,
        #58adff,
        #fff
    );

    -webkit-background-clip:text;
    color:transparent;

    text-shadow:0 0 30px rgba(50,150,255,.5);
}

.subtitle{
    text-align:center;
    color:#91a7c0;
    font-size:11px;
    letter-spacing:3px;
    margin-bottom:30px;
}

.input{
    width:100%;
    height:52px;
    margin-bottom:14px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;

    background:rgba(0,0,0,.28);
    color:white;

    outline:none;
    padding:0 16px;
    font-size:15px;

    transition:.25s;
}

.input:focus{
    border-color:#238cff;
    box-shadow:
        0 0 0 3px rgba(35,140,255,.1),
        0 0 25px rgba(35,140,255,.15);
}

.input::placeholder{
    color:#71839a;
}

.login-btn{
    position:relative;
    overflow:hidden;

    width:100%;
    height:54px;

    border:0;
    border-radius:13px;

    margin-top:8px;

    background:
        linear-gradient(
            100deg,
            #0876ff,
            #35a8ff,
            #0876ff
        );

    background-size:200% 100%;

    color:white;
    font-size:15px;
    font-weight:bold;
    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(0,100,255,.3);

    animation:buttonGlow 3s ease infinite;
}

@keyframes buttonGlow{
    0%,100%{background-position:0%}
    50%{background-position:100%}
}

.login-btn:active{
    transform:scale(.97);
}

.login-btn::after{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:50%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.5),
        transparent
    );

    transform:skewX(-20deg);
    animation:buttonShine 3s infinite;
}

@keyframes buttonShine{
    0%{left:-100%}
    50%,100%{left:150%}
}

/* ================= SOUND BUTTON ================= */

.sound-btn{
    position:fixed;
    z-index:50;

    right:18px;
    bottom:18px;

    width:52px;
    height:52px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.2);

    background:rgba(5,15,28,.75);

    color:white;
    font-size:21px;

    cursor:pointer;

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:
        0 0 25px rgba(0,110,255,.2);

    transition:.25s;
}

.sound-btn:active{
    transform:scale(.9);
}

.sound-btn.sound-on{
    border-color:#238cff;
    box-shadow:
        0 0 30px rgba(0,120,255,.55);
}

/* ================= STATUS ================= */

.status{
    text-align:center;
    margin-top:16px;

    color:#647991;
    font-size:9px;
    letter-spacing:2px;
}

.status span{
    color:#36a5ff;
}

/* ================= LOGIN TRANSITION ================= */

.login-success{
    animation:loginOut .8s forwards;
}

@keyframes loginOut{
    to{
        transform:
            translate(-50%,-50%)
            translateZ(500px)
            scale(.4);
        opacity:0;
        filter:blur(15px);
    }
}

.flash{
    position:fixed;
    inset:0;
    background:white;
    z-index:100;
    pointer-events:none;
    opacity:0;
}

.flash.active{
    animation:flash .7s ease;
}

@keyframes flash{
    0%{opacity:0}
    20%{opacity:.7}
    100%{opacity:0}
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .login-card{
        padding:32px 22px;
    }

    .logo{
        font-size:31px;
    }

    .car-wrap{
        width:110vw;
    }

    .road{
        width:220%;
    }
}
</style>
</head>

<body>

<div class="scene">

    <!-- PARTICLES -->
    <div class="particles">
        <i class="particle p1"></i>
        <i class="particle p2"></i>
        <i class="particle p3"></i>
        <i class="particle p4"></i>
        <i class="particle p5"></i>
        <i class="particle p6"></i>
        <i class="particle p7"></i>
        <i class="particle p8"></i>
        <i class="particle p9"></i>
        <i class="particle p10"></i>
    </div>

    <!-- ROAD -->
    <div class="road"></div>

    <!-- SPEED LINES -->
    <div class="speed-lines">

        <div class="speed s1"></div>
        <div class="speed s2"></div>
        <div class="speed s3"></div>
        <div class="speed s4"></div>
        <div class="speed s5"></div>
        <div class="speed s6"></div>

    </div>

    <!-- BMW -->
    <div class="car-wrap" id="car">
        <img
            src="bmw.jpg"
            alt="BMW"
        >
    </div>

    <!-- HEADLIGHT GLOW -->
    <div class="headlight"></div>

    <!-- LOGIN -->
    <div class="login-card" id="loginCard">

        <div class="logo">
            BMW
        </div>

        <div class="subtitle">
            ASTRA PERFORMANCE
        </div>

        <input
            class="input"
            id="username"
            type="text"
            placeholder="Username"
            autocomplete="off"
        >

        <input
            class="input"
            id="password"
            type="password"
            placeholder="Password"
        >

        <button
            class="login-btn"
            id="loginButton">
            ENTER
        </button>

        <div class="status">
            <span>●</span>
            SECURE DEMO ENVIRONMENT
        </div>

    </div>

</div>

<!-- ================= AUDIO ================= -->

<audio
    id="engineAudio"
    src="engine.mp3"
    preload="auto">
</audio>

<!-- SOUND CONTROL -->

<button
    class="sound-btn"
    id="soundButton"
    aria-label="Engine sound">
    🔇
</button>

<div class="flash" id="flash"></div>


<script>

/* =========================================================
   BMW ASTRA ENGINE SYSTEM
   ========================================================= */

const car = document.getElementById("car");
const engine = document.getElementById("engineAudio");
const soundButton = document.getElementById("soundButton");

let soundOn = false;
let engineTimer = null;

/*
   The visual car animation is 5.2 seconds.
   The engine sound follows the same acceleration cycle.
*/

const CYCLE_TIME = 5200;


/* ================= START ENGINE ================= */

async function startEngine(){

    if(soundOn) return;

    soundOn = true;

    soundButton.textContent = "🔊";
    soundButton.classList.add("sound-on");

    car.classList.add("car-driving");
    document.body.classList.add("car-speed");

    /*
       Start at low RPM.
    */

    engine.currentTime = 0;
    engine.playbackRate = 0.65;
    engine.volume = 0.12;

    try{
        await engine.play();
    }catch(error){

        /*
          Mobile browsers may require
          a direct user interaction.
        */

        console.log("Audio waiting for user interaction.");
        soundOn = false;
        soundButton.textContent = "🔇";
        soundButton.classList.remove("sound-on");

        return;
    }

    /*
       Gradually increase engine speed.
    */

    const startTime = performance.now();

    function accelerate(now){

        if(!soundOn) return;

        const elapsed = now - startTime;

        let progress = elapsed / CYCLE_TIME;

        if(progress > 1)
            progress = 1;

        /*
           Engine RPM increases:
           0.65x → 1.85x
        */

        engine.playbackRate =
            0.65 + (progress * 1.20);

        /*
           Engine volume increases:
           quiet → loud
        */

        engine.volume =
            0.12 + (progress * 0.68);

        if(progress < 1){

            requestAnimationFrame(accelerate);

        }else{

            /*
               Fade/restart for loop effect.
            */

            restartEngineCycle();
        }
    }

    requestAnimationFrame(accelerate);
}


/* ================= LOOP ================= */

function restartEngineCycle(){

    if(!soundOn) return;

    /*
       Small fade before restarting.
    */

    let fade = 0.8;

    const fadeTimer = setInterval(()=>{

        if(!soundOn){

            clearInterval(fadeTimer);
            return;
        }

        fade -= 0.08;

        engine.volume = Math.max(0,fade);

        if(fade <= 0){

            clearInterval(fadeTimer);

            engine.pause();
            engine.currentTime = 0;

            engine.playbackRate = 0.65;
            engine.volume = 0.12;

            engine.play().catch(()=>{});

            /*
               Start acceleration again.
            */

            setTimeout(()=>{

                if(soundOn)
                    startAccelerationOnly();

            },50);
        }

    },35);
}


/* ================= ACCELERATION ONLY ================= */

function startAccelerationOnly(){

    const startTime = performance.now();

    function accelerate(now){

        if(!soundOn) return;

        const elapsed = now - startTime;

        let progress = elapsed / CYCLE_TIME;

        if(progress > 1)
            progress = 1;

        engine.playbackRate =
            0.65 + (progress * 1.20);

        engine.volume =
            0.12 + (progress * 0.68);

        if(progress < 1){

            requestAnimationFrame(accelerate);

        }else{

            restartEngineCycle();

        }
    }

    requestAnimationFrame(accelerate);
}


/* ================= STOP ENGINE ================= */

function stopEngine(){

    soundOn = false;

    clearTimeout(engineTimer);

    engine.pause();
    engine.currentTime = 0;

    engine.playbackRate = 1;
    engine.volume = 0;

    car.classList.remove("car-driving");
    document.body.classList.remove("car-speed");

    soundButton.textContent = "🔇";
    soundButton.classList.remove("sound-on");
}


/* ================= SOUND BUTTON ================= */

soundButton.addEventListener("click",()=>{

    if(soundOn){

        stopEngine();

    }else{

        startEngine();

    }

});


/* =========================================================
   AUTO START AFTER FIRST USER TOUCH
   ========================================================= */

let firstInteraction = false;

document.addEventListener("pointerdown",()=>{

    if(firstInteraction)
        return;

    firstInteraction = true;

    /*
       Browsers allow audio after
       a user interaction.
    */

    startEngine();

},{once:true});


/* =========================================================
   LOGIN BUTTON
   ========================================================= */

const loginButton =
    document.getElementById("loginButton");

const loginCard =
    document.getElementById("loginCard");

const flash =
    document.getElementById("flash");


loginButton.addEventListener("click",()=>{

    /*
       Demo only.
       No credentials are transmitted anywhere.
    */

    loginCard.classList.add("login-success");

    flash.classList.add("active");

    setTimeout(()=>{

        flash.classList.remove("active");

        /*
           Return the card after the animation.
        */

        setTimeout(()=>{

            loginCard.classList.remove(
                "login-success"
            );

        },700);

    },400);

});


/* =========================================================
   MOUSE / TOUCH PARALLAX
   ========================================================= */

document.addEventListener("mousemove",(event)=>{

    const x =
        (event.clientX / window.innerWidth - .5) * 2;

    const y =
        (event.clientY / window.innerHeight - .5) * 2;

    loginCard.style.transform =
        `translate(-50%,-50%)
         translateZ(80px)
         rotateY(${x * 4}deg)
         rotateX(${-y * 4}deg)`;

});


/* =========================================================
   TOUCH PARALLAX
   ========================================================= */

document.addEventListener("touchmove",(event)=>{

    if(!event.touches.length)
        return;

    const x =
        event.touches[0].clientX /
        window.innerWidth - .5;

    const y =
        event.touches[0].clientY /
        window.innerHeight - .5;

    loginCard.style.transform =
        `translate(-50%,-50%)
         translateZ(80px)
         rotateY(${x * 3}deg)
         rotateX(${-y * 3}deg)`;

},{passive:true});


/* =========================================================
   INITIAL CAR START
   ========================================================= */

window.addEventListener("load",()=>{

    /*
       The car starts visually.
       Audio starts when the browser allows it.
    */

    car.classList.add("car-driving");
    document.body.classList.add("car-speed");

});


/* =========================================================
   RESTART VISUAL CAR IF ANIMATION ENDS
   ========================================================= */

car.addEventListener("animationiteration",()=>{

    /*
       Keeps the BMW continuously driving.
    */

    car.classList.add("car-driving");

});


</script>

</body>
</html>
