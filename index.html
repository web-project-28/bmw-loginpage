<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luxury Night Drive</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
#app{position:fixed;inset:0}.hud{position:fixed;z-index:5;left:50%;top:7%;
transform:translateX(-50%);text-align:center;pointer-events:none;text-transform:uppercase;letter-spacing:.22em}
.hud h1{margin:0;font-size:clamp(34px,7vw,88px);font-weight:800}.hud p{margin:8px 0 0;font-size:10px;opacity:.55}
#status{position:fixed;z-index:6;left:50%;bottom:6%;transform:translateX(-50%);
font-size:10px;letter-spacing:.2em;opacity:.65;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div class="hud"><h1>NIGHT DRIVE</h1><p>Luxury Performance · 3D Experience</p></div>
<div id="status">LOADING 3D VEHICLE</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x02040a,.018);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,500);
camera.position.set(0,1.7,10);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.getElementById("app").appendChild(renderer.domElement);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(
 new THREE.Vector2(innerWidth,innerHeight),1.35,.65,.78
));

const sky=new THREE.Mesh(
 new THREE.SphereGeometry(180,32,16),
 new THREE.ShaderMaterial({
  side:THREE.BackSide,uniforms:{time:{value:0}},
  vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform float time;varying vec3 vP;void main(){
   float y=normalize(vP).y*.5+.5;
   vec3 c=mix(vec3(.018,.025,.055),vec3(.002,.008,.025),y);
   float g=exp(-pow((y-.27)*7.,2.));
   c+=vec3(.02,.07,.16)*g;gl_FragColor=vec4(c,1.);
  }`
 })
);
scene.add(sky);

const road=new THREE.Mesh(
 new THREE.PlaneGeometry(80,260),
 new THREE.MeshStandardMaterial({color:0x030407,roughness:.38,metalness:.2})
);
road.rotation.x=-Math.PI/2;road.position.y=-.65;scene.add(road);

const laneMat=new THREE.MeshBasicMaterial({color:0x66aaff,transparent:true,opacity:.24});
for(const x of [-3.2,3.2]){
 const line=new THREE.Mesh(new THREE.PlaneGeometry(.035,260),laneMat);
 line.rotation.x=-Math.PI/2;line.position.set(x,-.63,0);scene.add(line);
}

const streaks=[];
for(let i=0;i<75;i++){
 const s=new THREE.Mesh(
  new THREE.PlaneGeometry(THREE.MathUtils.randFloat(.015,.08),THREE.MathUtils.randFloat(1.5,7)),
  new THREE.MeshBasicMaterial({color:0x80bfff,transparent:true,opacity:THREE.MathUtils.randFloat(.15,.65)})
 );
 s.rotation.x=-Math.PI/2;
 s.position.set(THREE.MathUtils.randFloat(-10,10),-.59,THREE.MathUtils.randFloat(-90,15));
 scene.add(s);streaks.push(s);
}

const count=1100,pos=new Float32Array(count*3);
for(let i=0;i<count;i++){
 pos[i*3]=THREE.MathUtils.randFloatSpread(80);
 pos[i*3+1]=THREE.MathUtils.randFloat(-2,20);
 pos[i*3+2]=THREE.MathUtils.randFloat(-100,20);
}
const pg=new THREE.BufferGeometry();
pg.setAttribute("position",new THREE.BufferAttribute(pos,3));
const particles=new THREE.Points(pg,new THREE.PointsMaterial({color:0x8dbaff,size:.035,transparent:true,opacity:.6}));
scene.add(particles);

let car=null;
new GLTFLoader().load("luxury_sports_car.glb",g=>{
 car=g.scene;car.position.set(0,-.55,-58);car.rotation.y=Math.PI;
 car.traverse(o=>{
  if(o.isMesh){
   o.castShadow=true;o.receiveShadow=true;
   if(o.material){
    o.material=Array.isArray(o.material)?o.material.map(m=>m.clone()):o.material.clone();
   }
  }
 });
 car.traverse(o=>{
  if(!o.isMesh||!o.material)return;
  const ms=Array.isArray(o.material)?o.material:[o.material];
  ms.forEach(m=>{
   if(m.color)m.color.lerp(new THREE.Color(0x050608),.72);
   if("roughness"in m)m.roughness=Math.min(m.roughness,.3);
   if("metalness"in m)m.metalness=Math.max(m.metalness,.72);
  });
 });
 scene.add(car);document.getElementById("status").textContent="SYSTEM READY";
},undefined,e=>{
 console.error(e);
 document.getElementById("status").textContent="ADD luxury_sports_car.glb TO THIS FOLDER";
});

const headGroup=new THREE.Group();scene.add(headGroup);
for(const x of [-.65,.65]){
 const spot=new THREE.SpotLight(0xbfdcff,95,45,Math.PI/9,.55,1.5);
 spot.position.set(x,.15,1.5);spot.target.position.set(x*.8,-.2,-28);
 headGroup.add(spot,spot.target);
 const glow=new THREE.Mesh(new THREE.SphereGeometry(.12,16,16),new THREE.MeshBasicMaterial({color:0xffffff}));
 glow.position.copy(spot.position);headGroup.add(glow);
}

let t=0;const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);t+=dt;
 sky.material.uniforms.time.value=t;

 if(car){
  const c=(t%7)/7;
  const e=c<.5?2*c*c:1-Math.pow(-2*c+2,2)/2;
  car.position.z=THREE.MathUtils.lerp(-58,2.2,e);
  car.scale.setScalar(1+Math.sin(t*8)*.012);
  car.rotation.y=Math.PI+Math.sin(t*1.5)*.018;
  headGroup.position.copy(car.position);headGroup.rotation.y=car.rotation.y;
  headGroup.visible=car.position.z>-45;
 }
 streaks.forEach((s,i)=>{
  s.position.z+=dt*(12+(i%5)*4);
  if(s.position.z>16){s.position.z=-100-Math.random()*35;s.position.x=THREE.MathUtils.randFloat(-10,10);}
 });
 for(let i=0;i<count;i++){
  pos[i*3+2]+=dt*(2.5+(i%7)*.5);
  if(pos[i*3+2]>22)pos[i*3+2]=-100;
 }
 particles.geometry.attributes.position.needsUpdate=true;
 camera.position.x=Math.sin(t*.32)*.12;
 camera.position.y=1.55+Math.sin(t*.55)*.025;
 camera.lookAt(0,.15,-15);
 composer.render();
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
